<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배지</title>
  <style>
    /* §4.5 디자인 토큰 (exact 값 — 변경 금지) */
    :root {
      --color-badge-success: #16a34a;
      --color-badge-warning: #d97706;
      --color-badge-error: #dc2626;
      --color-badge-text: #ffffff;
      --space-badge-gap: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f9fafb;
    }

    /* §4.7 320px 이상에서 가로 overflow 금지 — flex-wrap + max-width + 줄바꿈 허용 */
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-badge-gap);
      max-width: 480px;
      margin: 2rem auto;
      padding: var(--space-badge-gap);
    }

    /* §4.3 배지 공통 base */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 9999px;
      color: var(--color-badge-text);
      font-size: 1rem;
      line-height: 1.3;
    }

    /* §4.3 라벨 element (BEM) — 상태명 텍스트 (색상 비의존) */
    .badge__label {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* §4.4 상태 modifier — 배경색은 frozen 토큰 참조 */
    .badge--success {
      background: var(--color-badge-success);
    }

    .badge--warning {
      background: var(--color-badge-warning);
    }

    .badge--error {
      background: var(--color-badge-error);
    }
  </style>
</head>
<body>
  <!-- §4.2 DOM 계약 (frozen) — id/class 변경 금지 -->
  <main id="badge-list" class="badge-list">
    <!-- §4.4 각 배지는 role="status" + 색상 비의존 상태명 텍스트 라벨 -->
    <span id="badge-success" class="badge badge--success" role="status">
      <span class="badge__label">성공</span>
    </span>
    <span id="badge-warning" class="badge badge--warning" role="status">
      <span class="badge__label">경고</span>
    </span>
    <span id="badge-error" class="badge badge--error" role="status">
      <span class="badge__label">오류</span>
    </span>
  </main>
</body>
</html>
